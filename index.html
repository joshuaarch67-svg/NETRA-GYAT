<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="topbar">
        <!-- this is the logo of the system -->
        <div class="brand">
            <div class="brand logo">N</div>
            <div>
                <h1>NETRA-ROVER</h1>
                <p>robot monitoring control system</p>
            </div>
        </div>
        <!-- this is the navigation bar of the system -->
        <nav class="navbar">
                <a href="#dashboard">Dashboard</a>
                <a href="#fleet">Fleet</a>
                <a href="#telementary">Telementary</a>
                <a href="#alerts">alerts</a>
        </nav>    

        <!-- this block shows the system online, timing -->
         <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>
         </div>

         <!-- this is for dispatch mission button -->
          <button name="dispatch-open" type="button">Dispatch Mission</button>
    </header>
</body>
</html>
